services:
  - type: web
    name: personal-hub
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/server.py"
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: personal-hub-db
          property: connectionString
databases:
  - name: personal-hub-db
    plan: free
